<!DOCTYPE html><html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Кто Шпион</title><style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#120022;
    color:white;
    padding:20px;
}

h1{
    text-align:center;
    color:#9b59ff;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#aaa;
    margin-bottom:20px;
}

.card{
    background:#1b1230;
    border-radius:20px;
    padding:15px;
    margin-bottom:15px;
}

.section-title{
    margin-bottom:10px;
    color:#9b59ff;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.spy-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.btn{
    height:60px;
    border:none;
    border-radius:15px;
    background:#2a1f45;
    color:white;
    font-size:20px;
}

.btn.active{
    background:#8f52ff;
}

.main-btn{
    width:100%;
    height:60px;
    border:none;
    border-radius:15px;
    background:#8f52ff;
    color:white;
    font-size:22px;
    margin-top:15px;
}

.hidden{
    display:none;
}

.role-card{
    background:#1b1230;
    border-radius:20px;
    min-height:250px;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    font-size:36px;
    padding:20px;
}

</style></head><body><h1>КТО ШПИОН</h1>
<p class="subtitle">Один телефон</p><div id="settings"><div class="card"><div class="section-title">👥 Игроков</div><div class="grid">
<button class="btn player active">3</button>
<button class="btn player">4</button>
<button class="btn player">5</button>
<button class="btn player">6</button>
<button class="btn player">7</button>
<button class="btn player">8</button>
</div></div><div class="card"><div class="section-title">🕵️ Шпионов</div><div class="spy-grid">
<button class="btn spy active">1</button>
<button class="btn spy">2</button>
</div></div><div class="card"><div class="section-title">📂 Категории</div><div class="grid"><button class="btn category active">Все</button>
<button class="btn category active">Disney</button>
<button class="btn category active">Аниме</button>

<button class="btn category active">MMA</button>
<button class="btn category active">Футбол</button>

<button class="btn category active">Актёры</button>
<button class="btn category active">Мультфильмы</button>

<button class="btn category active">Певцы</button>
<button class="btn category active">Блогеры</button>

</div><p style="margin-top:10px">
Выбрано:
<span id="selectedCount">8</span>
</p></div><button class="main-btn" onclick="startGame()">
🎲 Начать игру
</button></div><div id="game" class="hidden"><h1 id="playerTitle">Игрок 1</h1><p class="subtitle">
Нажми на карточку
</p><div class="role-card" onclick="showRole()"><div id="cardText">
🕵️‍♂️<br>КТО ШПИОН
</div></div><button class="main-btn hidden"
id="nextBtn"
onclick="nextPlayer()">
Передать дальше
</button>

</div><script>
let players = 3;
let spies = 1;

let roles = [];
let currentPlayer = 0;
let opened = false;

document.querySelectorAll(".player").forEach(btn=>{

    btn.onclick=()=>{

        document.querySelectorAll(".player")
        .forEach(b=>b.classList.remove("active"));

        btn.classList.add("active");

        players=parseInt(btn.innerText);

    };

});

document.querySelectorAll(".spy").forEach(btn=>{

    btn.onclick=()=>{

        document.querySelectorAll(".spy")
        .forEach(b=>b.classList.remove("active"));

        btn.classList.add("active");

        spies=parseInt(btn.innerText);

    };

});

document.querySelectorAll(".category").forEach(btn=>{

    btn.onclick=()=>{

        if(btn.innerText==="Все"){

            const active =
            btn.classList.contains("active");

            document.querySelectorAll(".category")
            .forEach(c=>{

                if(active){
                    c.classList.remove("active");
                }else{
                    c.classList.add("active");
                }

            });

        }else{

            btn.classList.toggle("active");

        }

        updateCategories();

    };

});

function updateCategories(){

    let count = 0;

    document.querySelectorAll(".category.active")
    .forEach(btn=>{

        if(btn.innerText!=="Все"){
            count++;
        }

    });

    document.getElementById("selectedCount")
    .innerText = count;

}

function startGame(){

    roles = [];

    for(let i=0;i<players-spies;i++){
        roles.push("🏠 Мирный");
    }

    for(let i=0;i<spies;i++){
        roles.push("🕵️ Шпион");
    }

    roles.sort(()=>Math.random()-0.5);

    currentPlayer = 0;
    opened = false;

    document.getElementById("settings")
    .classList.add("hidden");

    document.getElementById("game")
    .classList.remove("hidden");

    document.getElementById("playerTitle")
    .innerHTML = "Игрок 1";

}

function showRole(){

    if(opened) return;

    opened = true;

    document.getElementById("cardText")
    .innerHTML = roles[currentPlayer];

    document.getElementById("nextBtn")
    .classList.remove("hidden");

}

function nextPlayer(){

    currentPlayer++;
    opened = false;

    if(currentPlayer >= players){

        document.getElementById("playerTitle")
        .innerHTML = "Игра началась";

        document.getElementById("cardText")
        .innerHTML = "🎉 Обсуждение игроков";

        document.getElementById("nextBtn")
        .classList.add("hidden");

        return;
    }

    document.getElementById("playerTitle")
    .innerHTML = "Игрок " + (currentPlayer+1);

    document.getElementById("cardText")
    .innerHTML = "🕵️‍♂️<br>КТО ШПИОН";

    document.getElementById("nextBtn")
    .classList.add("hidden");

}

</script>

</body>
</html>
