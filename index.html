<!DOCTYPE html><html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кто Шпион</title><style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#120022;
color:white;
padding:20px;
}

h1{
text-align:center;
color:#9b59ff;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#aaa;
margin-bottom:20px;
}

.card{
background:#1b1230;
border-radius:20px;
padding:15px;
margin-bottom:15px;
}

.section-title{
color:#9b59ff;
margin-bottom:10px;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}

.btn{
height:60px;
border:none;
border-radius:15px;
background:#2a1f45;
color:white;
font-size:20px;
}

.btn.active{
background:#8f52ff;
}

.main-btn{
width:100%;
height:60px;
border:none;
border-radius:15px;
background:#8f52ff;
color:white;
font-size:20px;
margin-top:10px;
}

.hidden{
display:none;
}

.role-card{
background:#1b1230;
border-radius:20px;
min-height:260px;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
font-size:30px;
padding:20px;
user-select:none;
}
</style></head><body><h1>КТО ШПИОН</h1>
<p class="subtitle">Один телефон</p><div id="settings"><div class="card">
<div class="section-title">Игроков</div><div class="grid">
<button class="btn player active">3</button>
<button class="btn player">4</button>
<button class="btn player">5</button>
<button class="btn player">6</button>
<button class="btn player">7</button>
<button class="btn player">8</button>
</div>
</div><div class="card">
<div class="section-title">Шпионов</div><div class="grid">
<button class="btn spy active">1</button>
<button class="btn spy">2</button>
</div>
</div><div class="card">
<div class="section-title">Время обсуждения</div><div class="grid">
<button class="btn timer active">0</button>
<button class="btn timer">2</button>
<button class="btn timer">3</button>
<button class="btn timer">5</button>
<button class="btn timer">7</button>
</div>
</div><button class="main-btn" onclick="startGame()">
Начать игру
</button></div><div id="game" class="hidden"><h1 id="playerTitle">Игрок 1</h1><p class="subtitle">
Удерживай карточку для просмотра роли
</p><div class="role-card"
ontouchstart="showRole()"
ontouchend="hideRole()"
onmousedown="showRole()"
onmouseup="hideRole()"><div id="cardText">
👀<br>УДЕРЖИВАЙ
</div></div><button id="nextBtn"
class="main-btn hidden"
onclick="nextPlayer()">
Готово, передать
</button>

</div><script>

let players = 3;
let spies = 1;
let discussionTime = 0;

let roles = [];
let currentPlayer = 0;

document.querySelectorAll(".player").forEach(btn=>{
btn.onclick=()=>{
document.querySelectorAll(".player")
.forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
players=parseInt(btn.innerText);
};
});

document.querySelectorAll(".spy").forEach(btn=>{
btn.onclick=()=>{
document.querySelectorAll(".spy")
.forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
spies=parseInt(btn.innerText);
};
});

document.querySelectorAll(".timer").forEach(btn=>{
btn.onclick=()=>{
document.querySelectorAll(".timer")
.forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
discussionTime=parseInt(btn.innerText);
};
});

function startGame(){

roles=[];

for(let i=0;i<players-spies;i++){
roles.push("🏠 Мирный");
}

for(let i=0;i<spies;i++){
roles.push("🕵️ Шпион");
}

roles.sort(()=>Math.random()-0.5);

currentPlayer=0;

document.getElementById("settings")
.classList.add("hidden");

document.getElementById("game")
.classList.remove("hidden");
}

function showRole(){

document.getElementById("cardText")
.innerHTML=roles[currentPlayer];

document.getElementById("nextBtn")
.classList.remove("hidden");

}

function hideRole(){

document.getElementById("cardText")
.innerHTML="👀<br>УДЕРЖИВАЙ";

}

function nextPlayer(){

currentPlayer++;

if(currentPlayer>=players){

startVoting();

return;
}

document.getElementById("playerTitle")
.innerHTML="Игрок "+(currentPlayer+1);

document.getElementById("cardText")
.innerHTML="👀<br>УДЕРЖИВАЙ";

document.getElementById("nextBtn")
.classList.add("hidden");

}

function startVoting(){

let html="<h3>🗳 Голосование</h3>";

for(let i=1;i<=players;i++){

html+=`
<button class="main-btn"
onclick="votePlayer(${i})">
Игрок ${i}
</button>
`;

}

document.getElementById("playerTitle")
.innerHTML="Голосование";

document.getElementById("cardText")
.innerHTML=html;

document.getElementById("nextBtn")
.classList.add("hidden");

}

function votePlayer(player){

let spiesList=[];

roles.forEach((role,index)=>{

if(role.includes("Шпион")){
spiesList.push("Игрок "+(index+1));
}

});

document.getElementById("playerTitle")
.innerHTML="Результат";

document.getElementById("cardText")
.innerHTML=
"Вы выбрали игрока "+player+
"<br><br>Шпионы:<br>"+
spiesList.join("<br>")+
"<br><br><button class='main-btn' onclick='location.reload()'>Новая игра</button>";

}

</script>
</body>
</html>
