<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Кто Шпион</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:linear-gradient(180deg,#17002f,#090014);
    min-height:100vh;
    color:white;
    padding:20px;
}

h1{
    text-align:center;
    font-size:48px;
    margin-top:20px;
    color:#9b59ff;
}

.subtitle{
    text-align:center;
    color:#aaa;
    margin-bottom:30px;
}

.card{
    background:rgba(255,255,255,0.05);
    border-radius:25px;
    padding:20px;
    margin-top:20px;
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.08);
}

.section-title{
    color:#9b59ff;
    margin-bottom:15px;
    font-size:18px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.btn{
    height:80px;
    border:none;
    border-radius:20px;
    background:#1d1430;
    color:white;
    font-size:30px;
    transition:0.2s;
}

.btn.active{
    background:#8f52ff;
}

.spy-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.main-btn{
    width:100%;
    height:70px;
    border:none;
    border-radius:22px;
    background:linear-gradient(90deg,#9b59ff,#7d3cff);
    color:white;
    font-size:26px;
    margin-top:25px;
}

.role-card{
    width:100%;
    height:350px;
    border-radius:30px;
    background:linear-gradient(180deg,#232047,#14112b);
    margin-top:40px;

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    font-size:42px;
    text-align:center;
}

.hidden{
    display:none;
}

.small{
    color:#aaa;
    margin-top:20px;
    font-size:18px;
}

</style>
</head>

<body>

<h1>КТО ШПИОН</h1>
<p class="subtitle">Один телефон</p>

<div id="settings">

<div class="card">

<div class="section-title">
👥 ИГРОКОВ
</div>

<div class="grid">

<button class="btn player active">3</button>
<button class="btn player">4</button>
<button class="btn player">5</button>
<button class="btn player">6</button>
<button class="btn player">7</button>
<button class="btn player">8</button>

</div>

</div>

<div class="card">

<div class="section-title">
🕵️ ШПИОНОВ
</div>

<div class="spy-grid">

<button class="btn spy active">1</button>
<button class="btn spy">2</button>

</div>

</div>

<button class="main-btn" onclick="startGame()">
🎲 Начать игру
</button>
<div class="card">

<div class="section-title">
📂 КАТЕГОРИИ
</div>

<div class="grid">

<button class="btn category active">Все</button>

<button class="btn category active">Disney</button>
<button class="btn category active">Аниме</button>

<button class="btn category active">MMA</button>
<button class="btn category active">Футбол</button>

<button class="btn category active">Актёры</button>
<button class="btn category active">Мультфильмы</button>

<button class="btn category active">Певцы</button>
<button class="btn category active">Блогеры</button>

</div>

<p style="margin-top:15px;color:#aaa;">
Выбрано:
<span id="selectedCount">8</span>
</p>

</div>


</div>

<div id="game" class="hidden">

<h1 id="playerTitle">
Игрок 1
</h1>

<p class="subtitle">
Нажми на карту чтобы увидеть роль
</p>

<div class="role-card" onclick="showRole()">

<div id="cardText">
🕵️‍♂️<br>
КТО ШПИОН
</div>

</div>

<p class="small">
Передай телефон следующему игроку
</p>

<button class="main-btn hidden" id="nextBtn" onclick="nextPlayer()">
✅ Готово, передаю →
</button>

</div>

<script>
let selectedCategories = [];

document.querySelectorAll(".category").forEach(btn=>{

    btn.onclick = ()=>{

        const name = btn.innerText;

        if(name === "Все"){

            const active =
            btn.classList.contains("active");

            document
            .querySelectorAll(".category")
            .forEach(c=>{

                if(active){
                    c.classList.remove("active");
                }else{
                    c.classList.add("active");
                }

            });

        }else{

            btn.classList.toggle("active");

            const allBtn =
            [...document.querySelectorAll(".category")]
            .find(x=>x.innerText==="Все");

            if(allBtn){
                allBtn.classList.remove("active");
            }

        }

        updateCategories();

    };

});

function updateCategories(){

    selectedCategories=[];

    document
    .querySelectorAll(".category.active")
    .forEach(btn=>{

        if(btn.innerText!=="Все"){

            selectedCategories.push(
                btn.innerText
            );

        }

    });

    document
    .getElementById("selectedCount")
    .innerText =
    selectedCategories.length;

}
let gameTimer = 0;
let timerInterval;

function startDiscussion(minutes){

    if(minutes === 0){
        document.getElementById("cardText").innerHTML =
        "🗳️ Голосование";
        return;
    }

    gameTimer = minutes * 60;

    timerInterval = setInterval(()=>{

        let m = Math.floor(gameTimer / 60);
        let s = gameTimer % 60;

        document.getElementById("cardText").innerHTML =
        "⏳ " + m + ":" + (s < 10 ? "0"+s : s);

        gameTimer--;

        if(gameTimer < 0){

            clearInterval(timerInterval);

            document.getElementById("cardText").innerHTML =
            "🗳️ Время вышло<br>Голосование";

        }

    },1000);

}



    gameTimer = minutes * 60;

    timerInterval = setInterval(()=>{

        let m = Math.floor(gameTimer / 60);
        let s = gameTimer % 60;

        document.getElementById("cardText").innerHTML =
        "⏳ " + m + ":" + (s < 10 ? "0"+s : s);

        gameTimer--;

        if(gameTimer < 0){

            clearInterval(timerInterval);

            document.getElementById("cardText").innerHTML =
            "🗳️ Время вышло<br>Голосование";

        }

    },1000);

}

function finishGame(){

    let spiesCount = roles.filter(r=>r.includes("Шпион")).length;

    document.getElementById("playerTitle").innerHTML =
    "Конец игры";

    document.getElementById("cardText").innerHTML =
    "🕵️ Шпионов было: " + spiesCount +
    "<br><br>Нажмите F5 для новой игры";

}
let players = 3;
let spies = 1;

let roles = [];
let currentPlayer = 0;
let opened = false;

document.querySelectorAll(".player").forEach(btn=>{

    btn.onclick=()=>{

        document.querySelectorAll(".player")
        .forEach(b=>b.classList.remove("active"));

        btn.classList.add("active");

        players=parseInt(btn.innerText);
    }

});

document.querySelectorAll(".spy").forEach(btn=>{

    btn.onclick=()=>{

        document.querySelectorAll(".spy")
        .forEach(b=>b.classList.remove("active"));

        btn.classList.add("active");

        spies=parseInt(btn.innerText);
    }

});

function startGame(){

    roles=[];

    for(let i=0;i<players-spies;i++){

        roles.push("🏠 Мирный");

    }

    for(let i=0;i<spies;i++){

        roles.push("🕵️ Шпион");

    }

    roles.sort(()=>Math.random()-0.5);

    document.getElementById("settings")
    .classList.add("hidden");

    document.getElementById("game")
    .classList.remove("hidden");

}

function showRole(){

    if(opened) return;

    opened=true;

    document.getElementById("cardText")
    .innerHTML=roles[currentPlayer];

    document.getElementById("nextBtn")
    .classList.remove("hidden");

}

function nextPlayer(){
currentPlayer++;
opened = false;
if(currentPlayer >= players){

    document.getElementById("playerTitle")
    .innerHTML="Обсуждение";

    document.getElementById("cardText")
    .innerHTML=`
        <button class="main-btn"
        onclick="startDiscussion(2)">
        ⏳ 2 минуты
        </button>

        <button class="main-btn"
        onclick="startDiscussion(3)">
        ⏳ 3 минуты
        </button>

        <button class="main-btn"
        onclick="startDiscussion(5)">
        ⏳ 5 минут
        </button>

        <button class="main-btn"
        onclick="startDiscussion(7)">
        ⏳ 7 минут
        </button>

        <button class="main-btn"
        onclick="startDiscussion(0)">
        ♾ Без времени
        </button>

        <button class="main-btn"
        onclick="finishGame()">
        🗳️ Завершить игру
        </button>
    `;

    document.getElementById("nextBtn")
    .classList.add("hidden");

    return;
}

    document.getElementById("playerTitle")
    .innerHTML="Игрок " + (currentPlayer+1);

    document.getElementById("cardText")
    .innerHTML="🕵️‍♂️<br>КТО ШПИОН";

    document.getElementById("nextBtn")
    .classList.add("hidden");

}

</script>

</body>
  </html>
