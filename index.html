<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Кто Шпион</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:linear-gradient(180deg,#17002f,#090014);
    min-height:100vh;
    color:white;
    padding:20px;
}

h1{
    text-align:center;
    font-size:48px;
    margin-top:20px;
    color:#9b59ff;
}

.subtitle{
    text-align:center;
    color:#aaa;
    margin-bottom:30px;
}

.card{
    background:rgba(255,255,255,0.05);
    border-radius:25px;
    padding:20px;
    margin-top:20px;
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.08);
}

.section-title{
    color:#9b59ff;
    margin-bottom:15px;
    font-size:18px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.btn{
    height:80px;
    border:none;
    border-radius:20px;
    background:#1d1430;
    color:white;
    font-size:30px;
    transition:0.2s;
}

.btn.active{
    background:#8f52ff;
}

.spy-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.main-btn{
    width:100%;
    height:70px;
    border:none;
    border-radius:22px;
    background:linear-gradient(90deg,#9b59ff,#7d3cff);
    color:white;
    font-size:26px;
    margin-top:25px;
}

.role-card{
    width:100%;
    height:350px;
    border-radius:30px;
    background:linear-gradient(180deg,#232047,#14112b);
    margin-top:40px;

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    font-size:42px;
    text-align:center;
}

.hidden{
    display:none;
}

.small{
    color:#aaa;
    margin-top:20px;
    font-size:18px;
}

</style>
</head>

<body>

<h1>КТО ШПИОН</h1>
<p class="subtitle">Один телефон</p>

<div id="settings">

<div class="card">

<div class="section-title">
👥 ИГРОКОВ
</div>

<div class="grid">

<button class="btn player active">3</button>
<button class="btn player">4</button>
<button class="btn player">5</button>
<button class="btn player">6</button>
<button class="btn player">7</button>
<button class="btn player">8</button>

</div>

</div>

<div class="card">

<div class="section-title">
🕵️ ШПИОНОВ
</div>

<div class="spy-grid">

<button class="btn spy active">1</button>
<button class="btn spy">2</button>

</div>

</div>

<button class="main-btn" onclick="startGame()">
🎲 Начать игру
</button>

</div>

<div id="game" class="hidden">

<h1 id="playerTitle">
Игрок 1
</h1>

<p class="subtitle">
Нажми на карту чтобы увидеть роль
</p>

<div class="role-card" onclick="showRole()">

<div id="cardText">
🕵️‍♂️<br>
КТО ШПИОН
</div>

</div>

<p class="small">
Передай телефон следующему игроку
</p>

<button class="main-btn hidden" id="nextBtn" onclick="nextPlayer()">
✅ Готово, передаю →
</button>

</div>

<script>

let players = 3;
let spies = 1;

let roles = [];
let currentPlayer = 0;
let opened = false;

document.querySelectorAll(".player").forEach(btn=>{

    btn.onclick=()=>{

        document.querySelectorAll(".player")
        .forEach(b=>b.classList.remove("active"));

        btn.classList.add("active");

        players=parseInt(btn.innerText);
    }

});

document.querySelectorAll(".spy").forEach(btn=>{

    btn.onclick=()=>{

        document.querySelectorAll(".spy")
        .forEach(b=>b.classList.remove("active"));

        btn.classList.add("active");

        spies=parseInt(btn.innerText);
    }

});

function startGame(){

    roles=[];

    for(let i=0;i<players-spies;i++){

        roles.push("🏠 Мирный");

    }

    for(let i=0;i<spies;i++){

        roles.push("🕵️ Шпион");

    }

    roles.sort(()=>Math.random()-0.5);

    document.getElementById("settings")
    .classList.add("hidden");

    document.getElementById("game")
    .classList.remove("hidden");

}

function showRole(){

    if(opened) return;

    opened=true;

    document.getElementById("cardText")
    .innerHTML=roles[currentPlayer];

    document.getElementById("nextBtn")
    .classList.remove("hidden");

}

function nextPlayer(){

    currentPlayer++;

    opened=false;

    if(currentPlayer >= players){

        document.getElementById("playerTitle")
        .innerHTML="Игра началась";

        document.getElementById("cardText")
        .innerHTML="🎉";

        document.getElementById("nextBtn")
        .classList.add("hidden");

        return;
    }

    document.getElementById("playerTitle")
    .innerHTML="Игрок " + (currentPlayer+1);

    document.getElementById("cardText")
    .innerHTML="🕵️‍♂️<br>КТО ШПИОН";

    document.getElementById("nextBtn")
    .classList.add("hidden");

}

</script>

</body>
  </html>
